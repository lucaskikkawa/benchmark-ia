itens:
- id: legibilidade
  criterio: legibilidade
  0: Nomes não mostram filtragem de concluídas e ordenação por prioridade.
  1: Só a filtragem ou a ordenação é claramente expressa.
  2: Nomes e fluxo descrevem seleção de pendentes e ordem decrescente.
- id: erros_bordas
  criterio: erros bordas
  0: Perde pendentes ou altera a entrada.
  1: 'Núcleo parcial: vazio, repetição ou cópia de dict incorretos.'
  2: Preserva vazio, extremos, ocorrências repetidas e cópias independentes.
- id: idiomatico
  criterio: idiomatico
  0: Ordena in-place a lista recebida ou usa dependências externas.
  1: Cria cópias, mas com laços e índices redundantes.
  2: Usa cópias rasas e sorted com chave de prioridade clara.
- id: manutenibilidade
  criterio: manutenibilidade
  0: Mistura estado global ou regras não descritas com o núcleo.
  1: Implementa núcleo isolado, mas políticas adicionais são difíceis de localizar.
  2: Função independente; políticas de empates/entradas extras são simples e coerentes.
- id: documentacao_instrucoes
  criterio: documentacao instrucoes
  0: SUPOSICOES.md ausente ou vazio.
  1: Documento registra apenas parte das decisões abertas.
  2: Documento registra desempate e entradas inválidas, com políticas coerentes com a implementação.
